name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # liboqs-python compiles the native liboqs library on first import.
      # By default it installs to ~/_oqs, but we redirect it into .venv so
      # it gets cached along with the Python environment.
      OQS_INSTALL_PATH: ${{ github.workspace }}/test/integration/cmp-test-suite/testdata/cmp-test-suite/.venv/_oqs
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: 'stable'
          cache: true

      - name: Run linter
        run: make lint

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true

      # OpenSSL 3.2+ is required for the integration tests because it introduced the
      # built-in CMP mock server features, specifically the '-port' and '-rsp_key'
      # options in the 'openssl cmp' application.
      #
      # Ubuntu 24.04 (current ubuntu-latest) only provides OpenSSL 3.0.x, which lacks
      # these server-side testing capabilities.
      - name: Cache OpenSSL LTS
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /opt/openssl-lts
          key: ${{ runner.os }}-openssl-3.5.6

      - name: Build OpenSSL LTS
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev perl wget
          VERSION="3.5.6"
          wget -q https://www.openssl.org/source/openssl-${VERSION}.tar.gz
          tar -xf openssl-${VERSION}.tar.gz
          cd openssl-${VERSION}
          ./config --prefix=/opt/openssl-lts --openssldir=/opt/openssl-lts shared zlib
          make -j$(nproc) > /dev/null
          sudo make install_sw > /dev/null

      - name: Add OpenSSL LTS to path
        run: |
          echo "/opt/openssl-lts/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/opt/openssl-lts/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Run unit tests
        run: make test

      - name: Run OpenSSL integration tests
        run: make test-integration-openssl

      - name: Setup EJBCA docker environment
        run: make setup-ejbca

      - name: Run EJBCA integration tests
        run: make test-integration-ejbca

      # The cmp-test-suite setup is split into clone, cache, and sync steps
      # instead of a single `make setup-cmp-test-suite` because:
      # 1. The clone must happen first so pyproject.toml exists for the cache key.
      # 2. The cache must be restored before `uv sync` to avoid re-downloading packages.
      #
      # Note: The repo does not contain uv.lock — it is generated by `uv sync`.
      # We use pyproject.toml as the cache key since it defines the dependencies.
      - name: Clone cmp-test-suite
        run: make _clone-cmp-test-suite

      - name: Cache cmp-test-suite Python environment
        uses: actions/cache@v4
        with:
          path: test/integration/cmp-test-suite/testdata/cmp-test-suite/.venv
          key: ${{ runner.os }}-cmp-test-suite-${{ hashFiles('test/integration/cmp-test-suite/testdata/cmp-test-suite/pyproject.toml') }}

      - name: Install cmp-test-suite dependencies
        run: make _sync-cmp-test-suite

      # The current cmp-test-suite uses liboqs-python, which compiles the native
      # library on first import. This step triggers precompilation so it's cached
      # with .venv. This may need updating if cmp-test-suite changes its PQ dependencies.
      - name: Build liboqs native library
        working-directory: test/integration/cmp-test-suite/testdata/cmp-test-suite
        run: uv run python -c "import oqs"

      - name: Run CMP Test Suite integration tests
        run: make test-integration-cmp-test-suite

      - name: Teardown EJBCA environment
        if: always()
        run: make teardown-ejbca
